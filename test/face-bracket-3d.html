<h1>直角接合：角碼與板孔</h1><p id="status"></p><div id="view"></div>
<script type="module">
import {createViewer} from '../js/blocks3d/viewer.js';
import {solveFaceMate} from '../js/blocks/face-mate.js';
import {planFaceBrackets} from '../js/blocks/face-bracket-geometry.js?v=20261008_bracketalign';
import {faceBracketBoxes} from '../js/blocks3d/face-brackets.js';
const plate={box:{min:{x:-30,y:-20,z:-1.5},max:{x:30,y:20,z:1.5}},outlines:[[{x:-30,y:-20},{x:30,y:-20},{x:30,y:20},{x:-30,y:20}]]};
const mate=solveFaceMate({hostBox:plate.box,childBox:plate.box,hostFace:'front',childFace:'bottom'});
const plan=planFaceBrackets(plate,plate,mate),R=mate.rotation,T=mate.translation;
const model=holes=>({sticks:[],pins:[],bounds:{minX:-50,maxX:50,minY:-50,maxY:50},frame:{outlines:plate.outlines,holes,thickness:3,z:-1.5}});
const root=model(plan.hostHoles);root.brackets=faceBracketBoxes(plan);
root.orthogonal=[{id:'child',matrix:[R[0][0],R[1][0],R[2][0],0,R[0][1],R[1][1],R[2][1],0,R[0][2],R[1][2],R[2][2],0,T.x,T.y,T.z,1],model:model(plan.childHoles)}];
createViewer(document.querySelector('#view')).update(root);
document.querySelector('#status').textContent=plan.ok?`${plan.brackets.length} 顆角碼，兩板與角碼使用同一組孔軸；可拖曳旋轉檢查。`:plan.reason;
</script>
