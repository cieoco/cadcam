<script type="module">
import {bracketFixture} from './fixtures/face-bracket-fixture.mjs';
import {openFaceWizard} from '../js/blocks/face-wizard-ui.js';
import {orthogonalExportExtras,withAdapterNodes} from '../js/blocks/orthogonal-joint.js';
import {inspectLinkExport,inspectFrameExport} from '../js/blocks/exporters.js';
import {frameConnectorNodes} from '../js/blocks/model.js';
import {normalizeSnapshot} from '../js/blocks/schema.js?v=20261007_singleface';
let f=bracketFixture();
const $=id=>document.getElementById(id);
function show(){
 const extras=orthogonalExportExtras(f.comps,f.modules,f.params,{stockMm:3});
 const a=extras.linkHoles.HostBar || [],b=extras.frameNodes.Child || [];
 $('status').textContent=`${f.modules[1].mount ? '接合已保存 · ' : ''}承接桿 ${a.length} 孔 · 直立底板 ${b.length} 孔（Ø3.2 mm）`;
 const geometries=[['承接桿',inspectLinkExport(f.comps[0],120,{},a)],['直立底板',inspectFrameExport(withAdapterNodes('Child',frameConnectorNodes(f.comps.filter(c=>c.moduleId==='Child')),extras),{})]];
 $('parts').replaceChildren();
 for(const [name,g] of geometries){const h=document.createElement('h2');h.textContent=name;$('parts').append(h);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','-80 -70 250 150');
 for(const ring of g.outlines){const p=document.createElementNS(svg.namespaceURI,'polygon');p.setAttribute('points',ring.map(p=>`${p.x},${-p.y}`).join(' '));p.setAttribute('fill','#e1e8e5');p.setAttribute('stroke','#477867');svg.append(p);}
 for(const hole of g.holes){const c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',hole.x);c.setAttribute('cy',-hole.y);c.setAttribute('r',hole.r);c.setAttribute('fill',hole.layer==='ADAPTER_HOLE'?'#df9122':'white');svg.append(c);}$('parts').append(svg);}
}
$('open').onclick=()=>{const initialMount=f.modules[1].mount || {face:{selection:{hostFace:location.search==='?reverse'?'back':'top',childFace:location.search==='?reverse'?'top':'back',alignU:0,alignV:0,offsetU:0,offsetV:0,gap:0,quarterTurns:location.search==='?reverse'?3:0}}};openFaceWizard({...f,modules:f.modules.map(m=>({...m,mount:null})),childId:'Child',stockMm:3,exportSettings:{},wizard:true,initialMount,isCurrent:()=>true,say:text=>$('status').textContent=text,commit:r=>{f={...f,...r};$('restore').disabled=false;show();}});};
$('restore').onclick=()=>{f=normalizeSnapshot(JSON.parse(JSON.stringify(f)));show();$('status').textContent+=' · 存檔還原成功';};
show();
</script></html>
