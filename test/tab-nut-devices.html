<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>榫槽手機尺寸驗收</title>
<style>body{margin:0;font:14px system-ui;background:#ddd}nav{display:flex;gap:4px;position:sticky;top:0;background:white;z-index:2}button{min-height:44px}#surface{position:relative;overflow:hidden}iframe{border:0;display:block;background:white;transform-origin:top left}</style>
<nav><button data-size="390,844">390×844</button><button data-size="360,640">360×640</button><button data-size="844,390">手機橫向</button><button data-size="1200,900">桌機</button><button id="large">放大文字</button></nav>
<div id="surface"><iframe id="device" title="測試裝置" src="tab-nut.html" width="390" height="844"></iframe></div>
<script>const device=document.getElementById('device');const fit=()=>{const scale=Math.min(1,(innerWidth-4)/Number(device.width),(innerHeight-48)/Number(device.height));device.style.transform=`scale(${scale})`;document.getElementById('surface').style.cssText=`width:${Number(device.width)*scale}px;height:${Number(device.height)*scale}px`;};addEventListener('resize',fit);fit();document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');device.width=w;device.height=h;fit();});document.getElementById('large').onclick=()=>{const d=device.contentDocument.querySelector('iframe')?.contentDocument;if(!d)return;let s=d.getElementById('large-test');if(s){s.remove();return;}s=d.createElement('style');s.id='large-test';s.textContent='button,label,select,input,summary,p{font-size:24px!important;line-height:1.3!important}';d.head.append(s);};</script></html>
