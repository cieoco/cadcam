<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>盒體手機驗收</title><style>body{margin:0;background:#ddd;font:14px system-ui}nav{display:flex;gap:4px;background:#fff}button{min-height:44px}iframe{border:0;display:block;transform-origin:top left}#surface{overflow:hidden}</style>
<nav><button data-size="390,844">390×844</button><button data-size="360,640">360×640</button><button data-size="844,390">手機橫向</button><button data-size="1200,900">桌機</button><button id="large">放大文字</button></nav><div id="surface"><iframe title="裝置" id="device" width="390" height="844" src="box-maker.html"></iframe></div>
<script>const device=document.getElementById('device');function fit(){const s=Math.min(1,(innerWidth-4)/Number(device.width),(innerHeight-48)/Number(device.height));device.style.transform=`scale(${s})`;document.getElementById('surface').style.cssText=`width:${Number(device.width)*s}px;height:${Number(device.height)*s}px`;}addEventListener('resize',fit);fit();document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{[device.width,device.height]=b.dataset.size.split(',');fit();});document.getElementById('large').onclick=()=>{const d=device.contentDocument;let s=d.getElementById('large-test');if(s){s.remove();return;}s=d.createElement('style');s.id='large-test';s.textContent='.box-maker button,.box-maker input,.box-maker label,.box-maker p,.box-maker select,.box-maker summary{font-size:24px!important}';d.head.append(s);};</script></html>
