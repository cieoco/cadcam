<body><main class="page"><p class="eyebrow">機構積木・學習目錄</p><h1>從零開始，設計會動的機構</h1><p class="lead">看範例、動手試錯，再做自己的設計。</p><div class="task-list">
<section class="task"><h2>第一單元｜四連桿</h2><p>學操作、認識四種機構，從補接到自己組裝，最後調出雨刷擺幅。</p><a class="entry-link" href="teaching-fourbar.html">開始第一單元 →</a></section>
<section class="task"><h2>第二單元｜滑塊曲柄</h2><p>把旋轉變成直線往復；調整曲柄與浮桿，設計指定行程的推送器。</p><a class="entry-link" href="teaching-slider.html">開始第二單元 →</a></section><section class="task"><h2>第三單元｜齒輪傳動</h2><p>觀察轉向與齒數比，調整轉速，探索同步夾爪。</p><a class="entry-link" href="teaching-gears.html">開始第三單元 →</a></section><section class="task"><h2>第四單元｜齒輪齒條</h2><p>把轉角變成直線位移，設計指定升降高度。</p><a class="entry-link" href="teaching-rack.html">開始第四單元 →</a></section><section class="task"><h2>第五單元｜組立應用</h2><p>將升降與夾爪接合，分別控制、調整並驗證動作。</p><a class="entry-link" href="teaching-assembly.html">開始第五單元 →</a></section></div><p><a href="blocks.html">直接開啟機構積木 →</a></p></main><script type="module" src="js/version-info.js?v=20261007_8"></script>
