  <header>
    <div><h1>六面體組立</h1><div id="learningMore"></div><div class="tag">真實接合板預覽 · 不寫入作品</div></div>
    <div class="mode" hidden role="group" aria-label="操作方式"><button id="wizardMode">精靈</button><button id="workMode">工作</button></div>
  </header>
  <main>
    <div class="stage">
      <div class="stage-head"><b id="stageTitle">選擇兩個機構</b><div class="key"><span class="host-key">● 承接端</span><span class="child-key">● 安裝端</span></div></div>
      <div class="scene-wrap" id="sceneWrap">
        <svg id="scene" viewBox="0 0 600 390" role="group" aria-label="兩機構六面體擺放預覽"></svg>
        <div class="mate-overlay" id="mateOverlay" role="group" aria-label="調整安裝位置" hidden>
          <button class="mate-arrow" data-arrow="uPlus" aria-label="向左右正方向移動；面內 U+">↑</button>
          <button class="mate-arrow" data-arrow="uMinus" aria-label="向左右負方向移動；面內 U−">↑</button>
          <button class="mate-arrow" data-arrow="vPlus" aria-label="向上下正方向移動；面內 V+">↑</button>
          <button class="mate-arrow" data-arrow="vMinus" aria-label="向上下負方向移動；面內 V−">↑</button>
          <button class="mate-center" id="mateCenter" aria-label="置中，清除左右與上下偏移">置中</button>
        </div>
      </div>
          <div class="mate-tools" role="group" aria-label="安裝尺寸與調整方式">
            <button id="mateMode" aria-pressed="false">移動</button>
            <button id="mateUChip" aria-label="設定左右偏移；面內 U offset">左右 0</button>
            <button id="mateVChip" aria-label="設定上下偏移；面內 V offset">上下 0</button>
            <button id="mateGapChip">間距 5</button>
            <button id="mateStepChip">步距 5</button>
          </div>
      <div id="bracketNote" style="padding:4px 12px 10px;font-size:12px;color:#60716e" hidden></div>
      <div class="rotation-actions" id="rotationActions" role="group" aria-label="接合角度"><button id="turnMinus" aria-label="接合角度減少 90 度">−90°</button><button id="angleChip">接合角度 0°</button><button id="turn" aria-label="接合角度增加 90 度">＋90°</button></div>
      <div class="view-actions" role="group" aria-label="旋轉觀看角度">
        <button id="viewLeft" aria-label="向左旋轉視角 90 度">↶</button><button id="viewRight" aria-label="向右旋轉視角 90 度">↷</button>
        <button id="viewFlip">上下翻轉</button><button id="viewReset">重設視角</button>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
      <div class="note">藍色：承接端外框。綠色：安裝端外框。亮色標示所選面；被遮住的面以虛線標示。外框示意不代表實際固定孔。</div>
    </div>
    <div class="panel">
      <div class="progress" id="progress" aria-label="步驟進度"></div>
      <section data-step="0">
        <h2>1 · 哪兩個機構？</h2><p>先選承接的位置，再選要安裝的機構。</p>
        <h3>承接端</h3><div class="cards" id="hosts"></div>
        <h3>安裝端</h3><div class="cards" id="children"></div>
      </section>
      <section data-step="1">
        <h2>2 · 選承接面</h2><p>直接點藍色外框的大面，選到的面會變亮藍色；拖曳可旋轉視角。</p><details id="hostFaceMore"><summary>其他面</summary><div class="faces" id="hostFaces"></div></details>
      </section>
      <section data-step="2">
        <h2>3 · 選安裝面</h2><p>旋轉後直接點安裝端的大面；下一步預覽接合。</p><div class="faces" id="childFaces"></div>
      </section>
      <section data-step="3">
        <h2>4 · 怎麼對齊？</h2><p>九宮格相對承接面的方向；偏置以毫米微調。</p>
        <div class="align" id="align"></div>
        <div id="adjustments"></div>
      </section>
      <div class="actions"><button id="back">上一步</button><button id="next" class="primary">下一步</button></div>
      <button id="cancel" class="cancel">取消修改，回到已確認結果</button>
      <button id="placementRecord" hidden>下載已確認擺放</button>
      <div class="message" id="message" role="status"></div>
    </div>
  </main>
  <dialog id="dimensionDialog" aria-labelledby="dimensionTitle">
    <form id="dimensionForm">
      <h2 id="dimensionTitle">設定尺寸</h2>
      <label id="dimensionLabel" for="dimensionValue">尺寸（mm）</label>
      <input id="dimensionValue" type="number" step="any" inputmode="decimal" required>
      <p id="dimensionError" class="error" role="alert" hidden>請輸入有效數字；步距須大於 0，間距不可小於 0。</p>
      <div class="dialog-actions"><button type="button" id="dimensionCancel">取消</button><button type="submit" class="primary">確定</button></div>
    </form>
  </dialog>
